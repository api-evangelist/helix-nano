name: Helix Nano
description: Helix Nano (HelixNano) is a Boston-based biotechnology company developing
  new ways to manipulate messenger RNA (mRNA) — the molecule that carries instructions
  from genes to the cell's protein-making machinery. Backed by DCVC since 2017, the
  company has developed techniques to improve the effectiveness and specificity of
  mRNA vaccines, including a next-generation COVID-19 vaccine engineered to resist
  viral mutation. HelixNano is now pursuing a broader vision of self-designing, adaptive
  therapeutics — drugs that could improve with every patient and, ideally, require
  only a single dose. The company operates out of 5 Channel Center Street in Boston,
  Massachusetts, and remains at an early, largely stealth stage with no public developer
  program or API surface at this time.
